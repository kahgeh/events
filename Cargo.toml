[package]
name = "events"
version = "0.1.0"
edition = "2021"

[dependencies]
turso = "0.5.1"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
regex = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
opentelemetry = "0.30.0"
tracing-opentelemetry = "0.31.0"

[dev-dependencies]
tempfile = "3.0"
test-log = "0.2"
